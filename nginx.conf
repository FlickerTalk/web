# TLS ends at Traefik, in front of this server.

# Only the header's first language counts. Regexes are tried in order, so zh-TW stays above zh.
map $http_accept_language $landing_lang {
    default en;
    "~*^\s*zh-(tw|hk|mo|hant)\b" zh-TW;
    "~*^\s*zh\b" zh-CN;
    "~*^\s*ar\b" ar;
    "~*^\s*bn\b" bn;
    "~*^\s*de\b" de;
    "~*^\s*es\b" es;
    "~*^\s*fr\b" fr;
    "~*^\s*hi\b" hi;
    "~*^\s*id\b" id;
    "~*^\s*it\b" it;
    "~*^\s*ja\b" ja;
    "~*^\s*ko\b" ko;
    "~*^\s*pl\b" pl;
    "~*^\s*pt\b" pt;
    "~*^\s*ro\b" ro;
    "~*^\s*ru\b" ru;
    "~*^\s*th\b" th;
    "~*^\s*tr\b" tr;
    "~*^\s*uk\b" uk;
    "~*^\s*vi\b" vi;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # the error log would record the client's IP on every 404
    access_log off;
    log_not_found off;
    error_log /dev/stderr crit;

    server_tokens off;
    absolute_redirect off;
    charset utf-8;

    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; frame-src https://www.youtube-nocookie.com; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Set here because an add_header inside a location drops all the headers above.
    add_header Vary "Accept-Language" always;

    # expires rather than add_header, for the same reason
    expires -1;

    location / {
        try_files $uri $uri/ =404;
    }

    # The app only accepts links that start exactly with /add# or /move#, so never redirect to /add/.
    location = /add {
        try_files /add/$landing_lang.html /add/index.html =404;
    }
    location = /move {
        try_files /move/$landing_lang.html /move/index.html =404;
    }

    # Apple's CDN does not follow redirects and the AASA file has no extension.
    location = /.well-known/assetlinks.json {
        types { }
        default_type application/json;
    }
    location = /.well-known/apple-app-site-association {
        types { }
        default_type application/json;
    }

    error_page 404 /404.html;
}
