# flickertalk.com (Plan §77): static files, no logs (§71) and headers that keep the page to itself.
# Traefik terminates TLS in front of this server.

# The language of the /add and /move landings (2026-10-04): the first one the browser asks for,
# if the app has it, otherwise English. Chinese by script: Taiwan, Hong Kong, Macao and Hant read
# zh-TW, the rest zh-CN. Regular expressions are tried in this order; the first match wins.
map $http_accept_language $landing_lang {
    default en;
    "~*^\s*zh-(tw|hk|mo|hant)\b" zh-TW;
    "~*^\s*zh\b" zh-CN;
    "~*^\s*ar\b" ar;
    "~*^\s*bn\b" bn;
    "~*^\s*de\b" de;
    "~*^\s*es\b" es;
    "~*^\s*fr\b" fr;
    "~*^\s*hi\b" hi;
    "~*^\s*id\b" id;
    "~*^\s*it\b" it;
    "~*^\s*ja\b" ja;
    "~*^\s*ko\b" ko;
    "~*^\s*pl\b" pl;
    "~*^\s*pt\b" pt;
    "~*^\s*ro\b" ro;
    "~*^\s*ru\b" ru;
    "~*^\s*th\b" th;
    "~*^\s*tr\b" tr;
    "~*^\s*uk\b" uk;
    "~*^\s*vi\b" vi;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # No access log; the error log would name the client's IP on every 404.
    access_log off;
    log_not_found off;
    error_log /dev/stderr crit;

    server_tokens off;
    absolute_redirect off;
    charset utf-8;

    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # /add and /move depend on the browser's language. Here and not in their locations: an
    # add_header there would drop every header above.
    add_header Vary "Accept-Language" always;

    # Tiny site: browsers always revalidate (ETag), so a change shows up at once. `expires` rather
    # than add_header, which would drop the headers above.
    expires -1;

    location / {
        try_files $uri $uri/ =404;
    }

    # The app accepts only links that start exactly with https://flickertalk.com/add# or /move#.
    # `$uri/` would redirect /add to /add/, and the browser would keep the fragment on the new
    # address, so these two pages are answered as they are, in the browser's language.
    location = /add {
        try_files /add/$landing_lang.html /add/index.html =404;
    }
    location = /move {
        try_files /move/$landing_lang.html /move/index.html =404;
    }

    # App Links (Android) and Universal Links (iOS) for /add and /move. Answered as JSON where they
    # are: Apple's CDN does not follow redirects, and the AASA file has no extension. No add_header
    # here, so the headers above still apply.
    location = /.well-known/assetlinks.json {
        types { }
        default_type application/json;
    }
    location = /.well-known/apple-app-site-association {
        types { }
        default_type application/json;
    }

    error_page 404 /404.html;
}
