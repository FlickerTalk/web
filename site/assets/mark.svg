<!-- The FlickerTalk mark in one colour: two devices and the direct link between them. Black on
     white, white when the reader's system is dark. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <style>
    .mark { fill: #000; stroke: #000; }
    @media (prefers-color-scheme: dark) { .mark { fill: #fff; stroke: #fff; } }
  </style>
  <g class="mark" fill="none">
    <circle cx="8" cy="24" r="4" opacity="0.45"/>
    <circle cx="24" cy="8" r="4"/>
    <path d="M11.5 20.5 20.5 11.5" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 4" fill="none"/>
  </g>
</svg>
